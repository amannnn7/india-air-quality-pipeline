[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi-pipeline"
version = "2.0.0"
description = "Daily air-quality pipeline for Indian cities: API -> Parquet -> Snowflake (PUT/COPY/MERGE) -> dbt -> tested CPCB AQI marts -> dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pydantic>=2.8",
  "pyarrow>=17",
  "duckdb>=1.1",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "dbt-snowflake>=1.9",
  "snowflake-connector-python>=3.12",
  "cryptography>=42",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "fakesnow>=0.9", "sqlglot>=25"]

[project.scripts]
aqi = "aqi_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aqi_pipeline = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
