version: 2

sources:
  - name: raw
    description: >
      Raw hourly readings. On Snowflake this is the RAW.AIR_QUALITY_HOURLY table filled by the
      Python loader (PUT -> COPY INTO -> MERGE). On DuckDB it is a view over the local Parquet lake.
    schema: raw
    tables:
      - name: air_quality_hourly
        description: One row per city per hour, exactly as received from Open-Meteo (CAMS global model).
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 54, period: hour}
        columns:
          - name: city_id
            data_tests: [not_null]
          - name: observed_at
            data_tests: [not_null]
