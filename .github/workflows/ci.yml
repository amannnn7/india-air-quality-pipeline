# CI: runs on every push and pull request. Nothing is merged unless ALL of these pass:
#   lint (ruff) -> 21 pytest tests (incl. dbt on DuckDB and on a Snowflake emulator)
#   -> full offline pipeline run -> Docker image builds and runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit + integration tests (pytest)
        run: pytest

      - name: dbt project parses for the Snowflake (prod) target
        working-directory: dbt
        env:
          AQI_DBT_TARGET: prod
        run: dbt parse --profiles-dir .

      - name: Full pipeline smoke test on sample data
        run: aqi sample --days 30

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aqi-pipeline .
      - name: Run the pipeline inside the container
        run: docker run --rm aqi-pipeline sample --days 15
